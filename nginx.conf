worker_processes auto;
pid /tmp/nginx.pid;
# Não registar URLs privadas nem tokens de partilha nos logs de acesso.
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format operational escape=json '{"time":"$time_iso8601","method":"$request_method","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /dev/stdout operational;
    server_tokens off;
    # Resolver novamente o nome da API quando o container for recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 11m;
    client_body_timeout 30s;
    send_timeout 30s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Apenas o proxy TLS local, pela gateway Docker, fornece o IP original.
        set_real_ip_from 172.30.44.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
        location ^~ /api/ {
            set $api_backend api:8080;
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 95s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
        }
        location ^~ /actuator { return 404; }
        location ^~ /internal { return 404; }
        location ~ /\. { return 404; }
        location = /index.html {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Cache-Control no-store always;
        }
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
            try_files $uri =404;
            expires 1h;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
